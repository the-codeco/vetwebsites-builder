{{/* The header search box. Shown unless the site owner turned it off in Appearance. */}}
{{define "site-search"}}{{if .Site.Search}}<form class="site-search" role="search" action="/search" method="get">
  <label class="sr-only" for="site-search-q">Search this site</label>
  <input id="site-search-q" type="search" name="q" placeholder="Search" maxlength="100" autocomplete="off">
  <button type="submit" class="site-search-btn" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
</form>{{end}}{{end}}
