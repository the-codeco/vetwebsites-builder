{{define "content"}}
<div class="card">
  <h1>Forgot your password?</h1>
  {{if .Notice}}
  <p role="status">{{.Notice}}</p>
  <p><a href="/admin/login">Back to log in</a></p>
  {{else}}
  <p class="muted">Enter your email address and, if this site can send email, we will send you a link to choose a new one.</p>
  <form method="post" action="/admin/forgot">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <button>Send me a link</button>
  </form>
  <p><a href="/admin/login">Back to log in</a></p>
  {{end}}
</div>
{{end}}
