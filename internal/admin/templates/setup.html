{{define "content"}}
<div class="card">
  <h1>Welcome — create the admin account</h1>
  <p class="muted">This only appears once, before any account exists.</p>
  <form method="post" action="/setup">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    {{if .Data}}<label for="setup_token">Setup token <span class="muted">(SETUP_TOKEN from the server's .env)</span></label>
    <input id="setup_token" name="setup_token" type="password" autocomplete="off" required autofocus>{{end}}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required{{if not .Data}} autofocus{{end}}>
    <label for="password">Password (10+ characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required>
    <button>Create account</button>
  </form>
</div>
{{end}}
